<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>GTA Toxlist | Under Maintenance</title>
    <meta name="title" content="GTA Toxlist | Under Maintenance">
    <meta name="description" content="GTA Toxlist is currently under maintenance. We'll be back soon with a fresh new look.">
    <meta name="author" content="GTA Toxlist">
    <meta name="robots" content="noindex, nofollow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gta-toxlist.github.io/">
    <meta property="og:title" content="GTA Toxlist | Under Maintenance">
    <meta property="og:description" content="We're working on something new. Stay tuned!">
    <meta property="og:image" content="https://gta-toxlist.github.io/Text.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gta-toxlist.github.io/">
    <meta property="twitter:title" content="GTA Toxlist | Under Maintenance">
    <meta property="twitter:description" content="We're working on something new. Stay tuned!">
    <meta property="twitter:image" content="https://gta-toxlist.github.io/Text.png">

    <link rel="canonical" href="https://gta-toxlist.github.io/">
    <link rel="icon" type="image/x-icon" href="/Text.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            card: '#1e1e1e',
                            text: '#e0e0e0'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen font-sans flex items-center justify-center">
    <div class="text-center max-w-2xl mx-auto px-4">
        <!-- Logo -->
        <div class="mb-12">
            <img src="Text.png" alt="GTA Toxlist Logo" class="w-64 h-auto mx-auto rounded-lg shadow-2xl">
        </div>

        <!-- Maintenance Message -->
        <div class="space-y-6">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 dark:text-white leading-tight">
                Under Maintenance
            </h1>
            
            <p class="text-xl md:text-2xl text-gray-600 dark:text-gray-400 font-medium">
                We'll be back soon with a fresh new look.
            </p>

            <div class="pt-8">
                <div class="inline-flex items-center space-x-2 px-6 py-3 bg-gray-100 dark:bg-gray-800 rounded-full">
                    <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                    <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Status: Maintenance in Progress</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-20 pt-8 border-t border-gray-200 dark:border-gray-800">
            <p class="text-sm text-gray-500 dark:text-gray-500">
                &copy; 2026 GTA Toxlist. Not an official or affiliated Rockstar Games website.
            </p>
        </footer>
    </div>
</body>
</html>
